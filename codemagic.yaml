# Codemagic configuration for debate_project (Flutter)
# Builds the iOS app and uploads it to TestFlight automatically.
#
# Required environment variables (add them in Codemagic UI:
#   App settings -> Environment variables):
#   - APP_STORE_CONNECT_API_KEY   : contents of the .p8 file (paste raw content)
#   - APP_STORE_CONNECT_KEY_ID    : 10-character API key ID
#   - APP_STORE_CONNECT_ISSUER_ID : issuer ID (UUID)
#   - P_VAR_URL                   : Supabase URL (from local .env)
#   - P_VAR_ANONKEY               : Supabase anon key (from local .env)
#   - REVENUECAT_APPLE            : RevenueCat API key for iOS
#   - REVENUECAT_GOOGLE           : RevenueCat API key for Android
#
# Code signing is AUTOMATIC: Codemagic generates the Apple Distribution
# certificate and the provisioning profile for com.kazuk.debate itself,
# so no manual .12 / .mobileprovision upload is needed.

workflows:
  testflight:
    name: Build & Upload to TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # Import the Codemagic variable group that contains all secrets
      # (App Store Connect API key, Supabase URL/anon key, RevenueCat keys).
      groups:
        - production
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Create .env from Codemagic environment variables
        # .env is gitignored, so it must be recreated during the build.
        # The values come from the Codemagic environment variables above.
        script: |
          echo "P_VAR_URL=$P_VAR_URL" > .env
          echo "P_VAR_ANONKEY=$P_VAR_ANONKEY" >> .env
          echo "REVENUECAT_APPLE=$REVENUECAT_APPLE" >> .env
          echo "REVENUECAT_GOOGLE=$REVENUECAT_GOOGLE" >> .env
          echo "--- .env created ---"
          grep -c "=" .env
      - name: Get packages
        script: |
          flutter pub get
      - name: Build IPA (Release)
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

code_signing:
  ios:
    automatic:
      certificates:
        - distribution
      provisioning_profiles:
        - com.kazuk.debate: app-store
