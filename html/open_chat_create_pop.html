<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>オープンチャット作成 (ポップ)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap');
        body { font-family: 'M PLUS Rounded 1c', sans-serif; }
    </style>
</head>
<body class="bg-amber-50 min-h-screen pb-28 text-amber-950">
    <!-- ヘッダー -->
    <header class="p-4 flex items-center justify-between sticky top-0 z-50 bg-amber-50/90 backdrop-blur-sm">
        <button class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm text-amber-800 hover:bg-amber-100 transition">
            <i class="fas fa-chevron-left"></i>
        </button>
        <h1 class="text-xl font-bold text-amber-900 tracking-wide">ルームをつくる</h1>
        <div class="w-10"></div>
    </header>

    <main class="max-w-md mx-auto px-5 pt-2 space-y-5">
        <!-- アイコン設定エリア（背景なし・中央配置） -->
        <div class="flex flex-col items-center justify-center py-4">
            <div class="relative group cursor-pointer" onclick="document.getElementById('icon-file-input').click()">
                <!-- アイコン枠 -->
                <div id="icon-preview" class="w-28 h-28 bg-amber-200 border-4 border-white rounded-full shadow-md flex flex-col items-center justify-center text-amber-600 group-hover:bg-amber-300 group-hover:scale-105 transition duration-200">
                    <i class="fas fa-camera text-3xl mb-1"></i>
                    <span class="text-xs font-bold">アイコン設定</span>
                </div>
                <!-- プラスバッジ -->
                <div class="absolute bottom-0 right-0 w-8 h-8 bg-orange-500 rounded-full border-2 border-white text-white flex items-center justify-center shadow">
                    <i class="fas fa-plus text-xs"></i>
                </div>
            </div>
            <input type="file" id="icon-file-input" class="hidden" accept="image/*" onchange="previewIcon(this)">
            <p class="text-xs text-amber-700/70 mt-2 font-medium">タップしてアイコン画像を選択</p>
        </div>

        <!-- ルーム名 -->
        <div class="bg-white p-5 rounded-3xl shadow-sm border border-amber-100 relative">
            <div class="absolute -top-3 left-4 bg-orange-400 text-white text-xs font-bold px-3 py-0.5 rounded-full shadow-sm">必須</div>
            <label class="block text-amber-900 font-bold mb-2 flex items-center mt-1">
                <i class="fas fa-tag text-amber-500 mr-2"></i>ルームのなまえ
            </label>
            <input type="text" placeholder="例：プログラミング雑談部屋" class="w-full bg-amber-50/60 rounded-2xl py-3 px-4 focus:outline-none focus:ring-4 focus:ring-amber-200 text-amber-950 font-medium placeholder-amber-300 transition text-base">
        </div>

        <!-- 説明文 -->
        <div class="bg-white p-5 rounded-3xl shadow-sm border border-amber-100">
            <label class="block text-amber-900 font-bold mb-2 flex items-center">
                <i class="fas fa-pen text-amber-500 mr-2"></i>どんなルーム？
            </label>
            <textarea rows="3" placeholder="どんな会話をするルームか自由に書いてね" class="w-full bg-amber-50/60 rounded-2xl py-3 px-4 focus:outline-none focus:ring-4 focus:ring-amber-200 text-amber-950 font-medium placeholder-amber-300 resize-none transition text-sm leading-relaxed"></textarea>
        </div>

        <!-- ハッシュタグ（パターンA: 独立追加UI） -->
        <div class="bg-white p-5 rounded-3xl shadow-sm border border-amber-100">
            <label class="block text-amber-900 font-bold mb-1 flex items-center">
                <i class="fas fa-hashtag text-amber-500 mr-2"></i>ハッシュタグ
            </label>
            <p class="text-xs text-amber-700/70 mb-3">検索で見つけやすくなります</p>
            
            <!-- タグ入力欄 -->
            <div class="flex items-center gap-2 mb-3">
                <div class="relative flex-1">
                    <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-amber-400 font-bold">#</span>
                    <input type="text" id="tag-input" placeholder="タグを入力（例：雑談）" onkeypress="handleTagKeypress(event)" class="w-full bg-amber-50/60 rounded-2xl py-2.5 pl-8 pr-3 focus:outline-none focus:ring-4 focus:ring-amber-200 text-amber-950 font-medium placeholder-amber-300 text-sm">
                </div>
                <button type="button" onclick="addTagFromInput()" class="bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold px-4 py-2.5 rounded-2xl text-sm transition flex items-center gap-1 shadow-sm flex-shrink-0">
                    <i class="fas fa-plus text-xs"></i> 追加
                </button>
            </div>

            <!-- タグリスト（バッジ表示） -->
            <div id="tags-container" class="flex flex-wrap gap-2 min-h-[32px]">
                <span class="inline-flex items-center bg-amber-100 text-amber-900 text-xs font-bold px-3 py-1.5 rounded-full border border-amber-200 shadow-sm animate-fade-in">
                    #初心者歓迎
                    <button type="button" onclick="removeTag(this)" class="ml-1.5 text-amber-600 hover:text-red-500 focus:outline-none"><i class="fas fa-times text-xs"></i></button>
                </span>
                <span class="inline-flex items-center bg-amber-100 text-amber-900 text-xs font-bold px-3 py-1.5 rounded-full border border-amber-200 shadow-sm animate-fade-in">
                    #雑談
                    <button type="button" onclick="removeTag(this)" class="ml-1.5 text-amber-600 hover:text-red-500 focus:outline-none"><i class="fas fa-times text-xs"></i></button>
                </span>
            </div>
        </div>

        <!-- 合言葉 -->
        <div class="bg-white p-5 rounded-3xl shadow-sm border border-amber-100">
            <div class="flex items-center justify-between cursor-pointer" onclick="togglePassword(this)">
                <div class="flex items-center">
                    <div class="w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center mr-3 text-amber-600">
                        <i class="fas fa-key text-base"></i>
                    </div>
                    <div>
                        <span class="font-bold text-amber-900 block text-sm">ひみつの合言葉</span>
                        <span class="text-xs text-amber-700/70 block">知ってる人だけ入れるよ</span>
                    </div>
                </div>
                <div class="w-14 h-8 bg-amber-200 rounded-full p-1 transition-colors duration-300 toggle-bg relative flex-shrink-0">
                    <div class="w-6 h-6 bg-white rounded-full shadow-md transform transition-transform duration-300 toggle-dot absolute left-1"></div>
                </div>
            </div>
            <div id="password-area" class="overflow-hidden max-h-0 transition-all duration-300 mt-0">
                <div class="pt-4 border-t border-amber-100 mt-4">
                    <input type="text" placeholder="合言葉をきめる" class="w-full bg-amber-50/60 rounded-2xl py-3 px-4 focus:outline-none focus:ring-4 focus:ring-amber-200 text-amber-950 font-bold placeholder-amber-300 text-center tracking-widest transition text-sm">
                </div>
            </div>
        </div>
    </main>

    <!-- 下部作成ボタン -->
    <div class="fixed bottom-0 left-0 w-full p-4 bg-gradient-to-t from-amber-50 via-amber-50/95 to-transparent z-40">
        <div class="max-w-md mx-auto">
            <button class="w-full bg-orange-500 hover:bg-orange-600 text-white font-extrabold text-base py-3.5 rounded-full shadow-[0_6px_0_#c2410c] hover:shadow-[0_3px_0_#c2410c] hover:translate-y-0.5 active:shadow-none active:translate-y-1.5 transition-all flex items-center justify-center gap-2">
                <i class="fas fa-sparkles"></i>
                <span>ルームをつくる！</span>
            </button>
        </div>
    </div>

    <!-- インタラクティブ動作用スクリプト -->
    <script>
        // 合言葉トグル
        function togglePassword(el) {
            const area = document.getElementById('password-area');
            const bg = el.querySelector('.toggle-bg');
            const dot = el.querySelector('.toggle-dot');
            
            if (area.classList.contains('max-h-0')) {
                area.classList.remove('max-h-0', 'mt-0');
                area.classList.add('max-h-32', 'mt-4');
                bg.classList.remove('bg-amber-200');
                bg.classList.add('bg-orange-400');
                dot.style.transform = 'translateX(24px)';
            } else {
                area.classList.add('max-h-0', 'mt-0');
                area.classList.remove('max-h-32', 'mt-4');
                bg.classList.add('bg-amber-200');
                bg.classList.remove('bg-orange-400');
                dot.style.transform = 'translateX(0)';
            }
        }

        // タグ追加
        function handleTagKeypress(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addTagFromInput();
            }
        }

        function addTagFromInput() {
            const input = document.getElementById('tag-input');
            let val = input.value.trim();
            if (!val) return;
            
            if (val.startsWith('#')) {
                val = val.substring(1).trim();
            }
            if (!val) return;

            const container = document.getElementById('tags-container');
            const tagEl = document.createElement('span');
            tagEl.className = "inline-flex items-center bg-amber-100 text-amber-900 text-xs font-bold px-3 py-1.5 rounded-full border border-amber-200 shadow-sm transition-transform duration-200 hover:scale-105";
            tagEl.innerHTML = `#${val} <button type="button" onclick="removeTag(this)" class="ml-1.5 text-amber-600 hover:text-red-500 focus:outline-none"><i class="fas fa-times text-xs"></i></button>`;
            
            container.appendChild(tagEl);
            input.value = '';
        }

        function removeTag(btn) {
            btn.parentElement.remove();
        }

        // アイコンプレビュー
        function previewIcon(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('icon-preview');
                    preview.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover rounded-full">`;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
