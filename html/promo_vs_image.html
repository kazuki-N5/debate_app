  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* FlutterのColors.blue標準値: #2196F3 */
    :root {
      --app-blue: #2196F3;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--app-blue);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans JP', sans-serif;
      user-select: none;
    }
    .preview-canvas-wrapper {
      background-color: var(--app-blue);
      transition: all 0.3s ease;
    }
    .control-panel {
      backdrop-filter: blur(12px);
      background-color: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }
    .vs-img-glow {
      filter: drop-shadow(0 0 35px rgba(255, 255, 255, 0.5));
    }
    .vs-img-shadow {
      filter: drop-shadow(0 20px 35px rgba(0, 0, 0, 0.4));
    }
    .vs-img-none {
      filter: none;
    }
  </style>
</head>

      <div class="flex flex-col gap-1.5">
        <div class="flex justify-between items-center">
          <label class="text-gray-300 font-medium">画像サイズ</label>
          <span id="sizeValue" class="text-blue-400 font-mono font-bold">200px</span>
        </div>
        <input id="sizeSlider" type="range" min="50" max="700" value="200" class="w-full accent-blue-500 cursor-pointer h-1.5 bg-gray-700 rounded-lg">
      </div>

      <!-- アスペクト比プリセット -->
      <div class="flex flex-col gap-1.5">
        <label class="text-gray-300 font-medium">枠サイズ (宣材用途)</label>
        <div class="grid grid-cols-4 gap-1">
          <button onclick="setAspect('full')" class="aspect-btn bg-blue-600 text-white py-1 rounded text-center transition hover:bg-blue-500 font-semibold" data-aspect="full">全画面</button>
          <button onclick="setAspect('square')" class="aspect-btn bg-white/10 py-1 rounded text-center transition hover:bg-white/20 text-gray-200 font-semibold" data-aspect="square">1:1</button>
          <button onclick="setAspect('phone')" class="aspect-btn bg-white/10 py-1 rounded text-center transition hover:bg-white/20 text-gray-200 font-semibold" data-aspect="phone">9:16</button>
          <button onclick="setAspect('banner')" class="aspect-btn bg-white/10 py-1 rounded text-center transition hover:bg-white/20 text-gray-200 font-semibold" data-aspect="banner">16:9</button>
        </div>
      </div>

      <!-- エフェクト切り替え -->
      <div class="flex flex-col gap-1.5">
        <label class="text-gray-300 font-medium">エフェクト</label>
        <div class="grid grid-cols-3 gap-1">
          <button onclick="setEffect('none')" class="effect-btn bg-blue-600 text-white py-1 rounded text-center transition hover:bg-blue-500 font-semibold" data-effect="none">標準</button>
          <button onclick="setEffect('shadow')" class="effect-btn bg-white/10 py-1 rounded text-center transition hover:bg-white/20 text-gray-200 font-semibold" data-effect="shadow">影</button>
          <button onclick="setEffect('glow')" class="effect-btn bg-white/10 py-1 rounded text-center transition hover:bg-white/20 text-gray-200 font-semibold" data-effect="glow">発光</button>
        </div>
      </div>
    </div>

    <!-- 下段: 高解像度ダウンロード機能 & ヒント -->
    <div class="flex items-center justify-between pt-1 border-t border-white/10">
      <span class="text-[11px] text-gray-400">
        <i class="fa-solid fa-circle-info mr-1 text-blue-400"></i>画面WクリックまたはHキーで完全撮影モード
      </span>
      <button onclick="downloadPNG()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-1.5 rounded-lg text-xs flex items-center gap-1.5 transition shadow-lg active:scale-95">
        <i class="fa-solid fa-download"></i>
        <span>高画質PNGを保存</span>
      </button>
    </div>

  </div>

  <!-- UI非表示時の復帰ボタン（画面右下に半透明で常駐） -->
  <button id="showUIBtn" onclick="toggleUI()" title="コントロールを表示" class="hidden fixed bottom-4 right-4 bg-black/40 hover:bg-black/80 text-white/80 hover:text-white p-3 rounded-full z-40 transition backdrop-blur text-sm shadow-lg">
    <i class="fa-solid fa-sliders"></i>
  </button>

  <script>
    const vsImage = document.getElementById('vsImage');
    const sizeSlider = document.getElementById('sizeSlider');
    const sizeValue = document.getElementById('sizeValue');
    const controlPanel = document.getElementById('controlPanel');
    const showUIBtn = document.getElementById('showUIBtn');
    const frameBox = document.getElementById('frameBox');
    const previewContainer = document.getElementById('previewContainer');

    let currentAspect = 'full';
    let currentEffect = 'none';

    // サイズスライダー更新
    sizeSlider.addEventListener('input', (e) => {
      const val = e.target.value;
      vsImage.style.width = val + 'px';
      sizeValue.innerText = val + 'px';
    });

    // アスペクト比変更
    function setAspect(aspect) {
      currentAspect = aspect;
      document.querySelectorAll('.aspect-btn').forEach(btn => {
        if (btn.dataset.aspect === aspect) {
          btn.className = 'aspect-btn bg-blue-600 text-white py-1 rounded text-center transition hover:bg-blue-500 font-semibold';
        } else {
          btn.className = 'aspect-btn bg-white/10 py-1 rounded text-center transition hover:bg-white/20 text-gray-200 font-semibold';
        }
      });

      if (aspect === 'full') {
        frameBox.style.width = '100%';
        frameBox.style.height = '100%';
        frameBox.style.aspectRatio = 'unset';
        frameBox.style.border = 'none';
        frameBox.style.boxShadow = 'none';
      } else if (aspect === 'square') {
        frameBox.style.width = 'min(85vh, 85vw)';
        frameBox.style.height = 'min(85vh, 85vw)';
        frameBox.style.aspectRatio = '1 / 1';
        frameBox.style.border = '2px dashed rgba(255, 255, 255, 0.4)';
        frameBox.style.boxShadow = '0 0 50px rgba(0,0,0,0.2)';
      } else if (aspect === 'phone') {
        frameBox.style.height = '85vh';
        frameBox.style.width = 'calc(85vh * 9 / 16)';
        frameBox.style.aspectRatio = '9 / 16';
        frameBox.style.border = '2px dashed rgba(255, 255, 255, 0.4)';
        frameBox.style.boxShadow = '0 0 50px rgba(0,0,0,0.2)';
      } else if (aspect === 'banner') {
        frameBox.style.width = 'min(85vw, calc(85vh * 16 / 9))';
        frameBox.style.height = 'calc(min(85vw, calc(85vh * 16 / 9)) * 9 / 16)';
        frameBox.style.aspectRatio = '16 / 9';
        frameBox.style.border = '2px dashed rgba(255, 255, 255, 0.4)';
        frameBox.style.boxShadow = '0 0 50px rgba(0,0,0,0.2)';
      }
    }

    // エフェクト設定
    function setEffect(effect) {
      currentEffect = effect;
      document.querySelectorAll('.effect-btn').forEach(btn => {
        if (btn.dataset.effect === effect) {
          btn.className = 'effect-btn bg-blue-600 text-white py-1 rounded text-center transition hover:bg-blue-500 font-semibold';
        } else {
          btn.className = 'effect-btn bg-white/10 py-1 rounded text-center transition hover:bg-white/20 text-gray-200 font-semibold';
        }
      });

      vsImage.classList.remove('vs-img-none', 'vs-img-shadow', 'vs-img-glow');
      if (effect === 'shadow') {
        vsImage.classList.add('vs-img-shadow');
      } else if (effect === 'glow') {
        vsImage.classList.add('vs-img-glow');
      } else {
        vsImage.classList.add('vs-img-none');
      }
    }

    // UI表示/非表示切り替え
    let isUIHidden = false;
    function toggleUI() {
      isUIHidden = !isUIHidden;
      if (isUIHidden) {
        controlPanel.classList.add('opacity-0', 'pointer-events-none', 'translate-y-10');
        showUIBtn.classList.remove('hidden');
        if (currentAspect !== 'full') {
          frameBox.style.border = 'none';
        }
      } else {
        controlPanel.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-10');
        showUIBtn.classList.add('hidden');
        if (currentAspect !== 'full') {
          frameBox.style.border = '2px dashed rgba(255, 255, 255, 0.4)';
        }
      }
    }

    // ショートカットキー (H: 非表示)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        toggleUI();
      }
    });

    // 画面ダブルクリックでトグル
    previewContainer.addEventListener('dblclick', () => {
      toggleUI();
    });

    // Canvasを用いた高解像度PNG保存
    function downloadPNG() {
      let width = 1920;
      let height = 1080;

      if (currentAspect === 'square') {
        width = 1080;
        height = 1080;
      } else if (currentAspect === 'phone') {
        width = 1080;
        height = 1920;
      } else if (currentAspect === 'banner') {
        width = 1920;
        height = 1080;
      } else {
        width = window.innerWidth * 2;
        height = window.innerHeight * 2;
      }

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      // 背景塗りつぶし (ホーム画面の青 #2196F3)
      ctx.fillStyle = '#2196F3';
      ctx.fillRect(0, 0, width, height);

      // 画像描画
      const img = new Image();
      img.onload = () => {
        const baseWidth = currentAspect === 'full' ? window.innerWidth : frameBox.clientWidth;
        const scaleRatio = width / baseWidth;
        const imgDisplayWidth = vsImage.clientWidth * scaleRatio;
        const imgDisplayHeight = vsImage.clientHeight * scaleRatio;

        const x = (width - imgDisplayWidth) / 2;
        const y = (height - imgDisplayHeight) / 2;

        if (currentEffect === 'shadow') {
          ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
          ctx.shadowBlur = 30 * scaleRatio;
          ctx.shadowOffsetY = 20 * scaleRatio;
        } else if (currentEffect === 'glow') {
          ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
          ctx.shadowBlur = 40 * scaleRatio;
        }

        ctx.drawImage(img, x, y, imgDisplayWidth, imgDisplayHeight);

        // ダウンロードリンク作成
        const link = document.createElement('a');
        link.download = `debate_vs_promo_${currentAspect}_${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      };
      img.src = vsImage.src;
    }
  </script>
</body>
</html>
