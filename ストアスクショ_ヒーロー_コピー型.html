<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>debata ストアスクショ ヒーロー コピー型（端末なし）</title>
<style>
  :root {
    --blue: #2196F3;
    --orange: #FF7043;
    --red: #E53935;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    background: #070D1A;
    min-height: 100vh;
  }

  /* ---- ツールバー（スクショには写らない） ---- */
  .toolbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
    background: rgba(7,13,26,.92); backdrop-filter: blur(6px);
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; color: #CFE3FF; font-size: 13px;
    border-bottom: 1px solid rgba(255,255,255,.12);
  }
  .toolbar .btn {
    background: #1E88E5; color: #fff; border: none; border-radius: 8px;
    padding: 6px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .toolbar .btn:hover { background: #1565C0; }
  .toolbar .btn.on { background: #0D47A1; }
  .toolbar .note { color: #8FB6E8; margin-left: auto; }

  /* ---- スクショ本体 1290×2796 ---- */
  .shot {
    width: 1290px; height: 2796px;
    position: relative; overflow: hidden;
    margin: 0 auto;
    background:
      radial-gradient(950px 720px at 14% 16%, rgba(255,112,67,.28) 0%, rgba(255,112,67,0) 62%),
      radial-gradient(950px 720px at 86% 84%, rgba(229,57,53,.25) 0%, rgba(229,57,53,0) 62%),
      radial-gradient(700px 520px at 84% 8%, rgba(255,193,7,.16) 0%, rgba(255,193,7,0) 60%),
      linear-gradient(170deg, #0A1226 0%, #0D2137 42%, #123C66 76%, #1565C0 100%);
    transform-origin: center top;
    color: #fff;
  }

  /* 背景演出 */
  .vs-watermark {
    position: absolute; top: 820px; left: 50%;
    transform: translateX(-50%) rotate(-8deg);
    font-size: 900px; font-weight: 900; letter-spacing: -30px;
    color: rgba(255,255,255,.05); line-height: 1;
    user-select: none; pointer-events: none;
  }
  .bubble-bg {
    position: absolute; border-radius: 40px; opacity: .08;
    background: #fff; pointer-events: none;
  }
  .bubble-bg.b1 { width: 260px; height: 170px; left: 90px;  top: 430px;  transform: rotate(-12deg); }
  .bubble-bg.b2 { width: 300px; height: 180px; right: 80px; top: 560px;  transform: rotate(10deg); }
  .bubble-bg.b3 { width: 230px; height: 150px; left: 70px;  bottom: 420px; transform: rotate(8deg); }
  .bubble-bg.b4 { width: 280px; height: 170px; right: 60px; bottom: 320px; transform: rotate(-8deg); }

  /* ---- 上部 ---- */
  .brand {
    position: absolute; top: 110px; left: 0; right: 0;
    display: flex; justify-content: center; align-items: center; gap: 24px;
  }
  .brand .logo {
    width: 92px; height: 92px; border-radius: 26px;
    background: linear-gradient(140deg, #FFB300, #FF7043 55%, #E53935);
    display: flex; align-items: center; justify-content: center;
    font-size: 50px; font-weight: 900; color: #fff;
    box-shadow: 0 14px 34px rgba(0,0,0,.45);
  }
  .brand .name { font-size: 48px; font-weight: 900; letter-spacing: 1px; }

  /* 日本初バッジ */
  .nihon-hatsu {
    position: absolute; top: 300px; left: 0; right: 0;
    display: flex; justify-content: center;
  }
  .nihon-hatsu .pill {
    display: flex; align-items: center; gap: 18px;
    background: rgba(255,255,255,.12);
    border: 3px solid rgba(255,255,255,.45);
    border-radius: 999px; padding: 18px 44px;
    font-size: 40px; font-weight: 900; letter-spacing: 4px;
    box-shadow: 0 10px 40px rgba(0,0,0,.35);
    backdrop-filter: blur(3px);
  }
  .nihon-hatsu .sun {
    width: 46px; height: 46px; border-radius: 50%;
    background: #E53935; display: inline-block;
    box-shadow: 0 0 26px rgba(229,57,53,.9);
  }

  /* キャッチコピー */
  .hero-copy {
    position: absolute; top: 560px; left: 0; right: 0;
    text-align: center;
  }
  .hero-copy h1 {
    font-size: 168px; font-weight: 900; line-height: 1.12; letter-spacing: 3px;
    text-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .hero-copy h1 .accent {
    background: linear-gradient(92deg, #FFD54F 0%, #FF8A65 45%, #E53935 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .hero-copy .sub {
    margin-top: 66px; font-size: 56px; font-weight: 800; letter-spacing: 3px;
    color: rgba(255,255,255,.96); text-shadow: 0 10px 34px rgba(0,0,0,.45);
  }
  .hero-copy .sub2 {
    margin-top: 24px; font-size: 40px; font-weight: 500;
    color: rgba(255,255,255,.75);
  }

  /* ---- 特徴リスト ---- */
  .features {
    position: absolute; top: 1500px; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; gap: 34px;
    padding: 0 60px; z-index: 10;
  }
  .feat {
    width: 100%; max-width: 980px;
    display: flex; align-items: center; gap: 40px;
    background: rgba(255,255,255,.1);
    border: 2px solid rgba(255,255,255,.3);
    border-radius: 40px; padding: 34px 48px;
    backdrop-filter: blur(3px);
    box-shadow: 0 16px 44px rgba(0,0,0,.25);
  }
  .feat .ico {
    width: 110px; height: 110px; border-radius: 30px; flex-shrink: 0;
    background: linear-gradient(145deg, rgba(255,255,255,.22), rgba(255,255,255,.06));
    border: 2px solid rgba(255,255,255,.35);
    display: flex; align-items: center; justify-content: center;
    font-size: 60px;
  }
  .feat .txt .t { font-size: 46px; font-weight: 900; letter-spacing: 1px; }
  .feat .txt .d { margin-top: 8px; font-size: 31px; font-weight: 500; color: rgba(255,255,255,.82); line-height: 1.5; }

  /* ---- 下部: 評価 + ダウンロード ---- */
  .bottom {
    position: absolute; bottom: 120px; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; gap: 40px;
    z-index: 10;
  }
  .rating { display: flex; align-items: center; gap: 20px; }
  .rating .stars { font-size: 54px; letter-spacing: 6px; }
  .rating .score { font-size: 46px; font-weight: 900; }
  .rating .users { font-size: 30px; font-weight: 600; color: rgba(255,255,255,.8); }
  .dl {
    display: flex; align-items: center; gap: 22px;
    background: linear-gradient(140deg, #FFB300, #FF7043 55%, #E53935);
    border-radius: 999px; padding: 26px 70px;
    font-size: 44px; font-weight: 900; letter-spacing: 2px;
    box-shadow: 0 18px 60px rgba(229,57,53,.5);
  }
  .dl .down { font-size: 52px; }

  /* ---- 演出エモジ ---- */
  .fx { position: absolute; z-index: 8; filter: drop-shadow(0 10px 26px rgba(0,0,0,.35)); animation: floaty 4.5s ease-in-out infinite; }
  .fx.f1 { left: 110px;  top: 1180px; font-size: 150px; }
  .fx.f2 { right: 130px; top: 1260px; font-size: 130px; animation-delay: 1s; }
  .fx.f3 { left: 140px;  bottom: 760px; font-size: 140px; animation-delay: 2s; }
  .fx.f4 { right: 150px; bottom: 950px; font-size: 150px; animation-delay: .5s; }
  @keyframes floaty {
    0%,100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-26px) rotate(4deg); }
  }

  /* ---- キャプチャモード ---- */
  body.capture { padding: 0; background: #fff; }
  body.capture .toolbar { display: none; }
  body.capture .shot { transform: none !important; margin: 0; }
  body.capture .fx, body.capture .bubble-bg { animation: none !important; }

  body:not(.capture) { padding: 64px 12px 40px; }
  body:not(.capture) .shot { box-shadow: 0 40px 120px rgba(0,0,0,.6); border-radius: 24px; }
</style>
</head>
<body>

  <div class="toolbar" id="toolbar">
    <span>🎨 debata ストアスクショ ヒーロー コピー型（端末なし）</span>
    <button class="btn on" id="btn-fit" type="button">画面にフィット</button>
    <button class="btn" id="btn-100" type="button">実寸 100%</button>
    <button class="btn" id="btn-cap" type="button">📷 書き出し用表示</button>
    <span class="note">1290×2796px（6.7インチ基準）</span>
  </div>

  <div class="shot" id="shot">

    <div class="vs-watermark">VS</div>
    <div class="bubble-bg b1"></div>
    <div class="bubble-bg b2"></div>
    <div class="bubble-bg b3"></div>
    <div class="bubble-bg b4"></div>

    <!-- ブランド -->
    <div class="brand">
      <div class="logo">D</div>
      <span class="name">debata</span>
    </div>

    <!-- 日本初バッジ -->
    <div class="nihon-hatsu">
      <div class="pill"><span class="sun"></span>日本初のレスバ専用SNS</div>
    </div>

    <!-- キャッチコピー -->
    <div class="hero-copy">
      <h1>レスバが、<br><span class="accent">SNSになった。</span></h1>
      <div class="sub">言いたいことは、ここで言えばいい。</div>
      <div class="sub2">マッチングからAI判定まで、全部このアプリで完結。</div>
    </div>

    <!-- 特徴リスト -->
    <div class="features">
      <div class="feat">
        <div class="ico">⚡</div>
        <div class="txt">
          <div class="t">ランダムマッチで即対戦</div>
          <div class="d">相手が見つかった瞬間、もう始まってる</div>
        </div>
      </div>
      <div class="feat">
        <div class="ico">🤖</div>
        <div class="txt">
          <div class="t">AIがジャッジ</div>
          <div class="d">勝敗はAIが判定理由つきで判定。納得の決着</div>
        </div>
      </div>
      <div class="feat">
        <div class="ico">🏆</div>
        <div class="txt">
          <div class="t">レート・ランキング</div>
          <div class="d">勝ってトロフィーを稼ぎ、日本一の論客を目指せ</div>
        </div>
      </div>
    </div>

    <!-- 評価 + ダウンロード -->
    <div class="bottom">
      <div class="rating">
        <span class="stars">★★★★★</span>
        <span class="score">4.7</span>
        <span class="users">／ もう1,000人以上が対戦中</span>
      </div>
      <div class="dl"><span class="down">⬇</span>今すぐ無料でダウンロード</div>
    </div>

    <!-- 演出 -->
    <div class="fx f1">🔥</div>
    <div class="fx f2">⚡</div>
    <div class="fx f3">💬</div>
    <div class="fx f4">🏆</div>

  </div>

<script>
  const shot = document.getElementById('shot');
  const W = 1290, H = 2796;
  const isCapture = new URLSearchParams(location.search).get('capture') === '1';
  if (isCapture) document.body.classList.add('capture');

  function fit() {
    if (document.body.classList.contains('capture')) return;
    const scale = Math.min(1, (window.innerWidth - 30) / W, (window.innerHeight - 120) / H);
    shot.style.transform = `scale(${scale})`;
  }

  document.getElementById('btn-fit').addEventListener('click', () => {
    document.body.classList.remove('capture');
    document.getElementById('btn-cap').classList.remove('on');
    document.getElementById('btn-fit').classList.add('on');
    document.getElementById('btn-100').classList.remove('on');
    fit();
  });
  document.getElementById('btn-100').addEventListener('click', () => {
    document.body.classList.remove('capture');
    document.getElementById('btn-cap').classList.remove('on');
    document.getElementById('btn-fit').classList.remove('on');
    document.getElementById('btn-100').classList.add('on');
    shot.style.transform = 'scale(1)';
  });
  document.getElementById('btn-cap').addEventListener('click', () => {
    document.body.classList.add('capture');
    document.getElementById('btn-cap').classList.add('on');
    document.getElementById('btn-fit').classList.remove('on');
    document.getElementById('btn-100').classList.remove('on');
  });

  window.addEventListener('resize', fit);
  fit();
</script>
</body>
</html>
